name: Build and Publish Generated Files

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 / Beijing 04:00

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main branch
      run: |
        git clone --depth 1 --branch main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .

    - name: Install dependencies
      run: |
        python3.12 --version
        python3.12 -m venv .venv
        .venv/bin/python --version
        .venv/bin/python -m pip install requests tldextract

    - name: Generate IP lists and ROS scripts
      run: |
        .venv/bin/python -u scripts/ChinaIP.py
        timeout 75 .venv/bin/python -u scripts/ChinaASN.py
        .venv/bin/python -u scripts/ChinaROS.py
        .venv/bin/python -u scripts/DnsStaticGFW.py
        .venv/bin/python -u scripts/DnsStaticAI.py
        .venv/bin/python -u scripts/GfwIpCidr.py
        .venv/bin/python -u scripts/ProxyDomains.py
        .venv/bin/python -u scripts/DomainLists.py

    - name: Push generated files to release-files branch
      run: |
        mkdir generated
        mv *.rsc *.list *.txt *.conf generated/ 2>/dev/null || true

        cd generated
        git init
        git config user.name "gitea-actions"
        git config user.email "actions@gitea.jeffok.com"
        git add .
        git commit -m "Update generated files"
        git branch -M release-files
        git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@gitea.jeffok.com:4443/jeff/asn-china.git"
        git push --force origin release-files
